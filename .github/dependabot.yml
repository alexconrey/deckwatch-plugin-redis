# Dependabot version updates, weekly: cargo, including the
# deckwatch-plugin-sdk git dependency, and GitHub Actions.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # Wait a few days after a release before proposing it, to avoid yanked or
    # compromised releases. Security updates bypass this.
    cooldown:
      default-days: 3
      semver-major-days: 7
      # Our own SDK skips the cooldown. Dependabot dates a git tag by its
      # GitHub Release, so for 3 days after an SDK release it filters the new
      # tags and falls back to an older one, and the SDK's v0.5.1, v0.7.0 and
      # v0.8.0 tags carry stale Cargo.toml versions that don't resolve.
      exclude:
        - deckwatch-plugin-sdk
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # github-actions supports only default-days.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
